<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>观察自心 · 解深密经诠义讲经整理</title>
<style>
:root{--bg:#faf7f0;--ink:#2a2622;--mute:#7a7167;--line:#e2dacb;--acc:#8a3b20;--card:#fffdf8}
@media (prefers-color-scheme:dark){:root{--bg:#1c1a17;--ink:#e9e3d8;--mute:#9c9386;--line:#3a352e;--acc:#e0916f;--card:#24211d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.95 "Noto Serif SC","Songti SC","STSong",serif}
main{max-width:760px;margin:0 auto;padding:48px 22px 140px}
nav.top{font:14px/1.5 system-ui,sans-serif;margin-bottom:28px}nav.top a{color:var(--acc);text-decoration:none}
h1{font-size:34px;margin:0 0 4px;letter-spacing:.06em}.sub{color:var(--mute);margin:0 0 32px;font-size:15px}
h2{font-size:22px;margin:44px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
h3{font-size:18px;margin:28px 0 6px;color:var(--acc)}
p{margin:0 0 16px;text-align:justify}.lead{color:var(--mute);font-size:16px}
sup.fn{position:relative;cursor:pointer;color:var(--acc);font:600 11px/1 system-ui,sans-serif;padding:1px 3px;margin:0 1px;border-radius:3px;background:color-mix(in srgb,var(--acc) 12%,transparent)}
sup.fn:hover,sup.fn:focus{background:var(--acc);color:var(--bg);outline:none}
sup.fn::after{content:attr(data-tip);position:absolute;left:50%;bottom:150%;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:var(--bg);font:500 13px/1.4 system-ui,sans-serif;padding:6px 10px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .12s;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.2)}
sup.fn:hover::after,sup.fn:focus::after{opacity:1}
ol.notes{font:14px/1.7 system-ui,sans-serif;color:var(--mute);padding-left:28px}ol.notes a{color:var(--acc);text-decoration:none;white-space:nowrap}
#pl{position:fixed;right:16px;bottom:16px;width:360px;max-width:calc(100vw - 32px);background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.25);overflow:hidden;display:none;z-index:10}
#pl.on{display:block}#pl .bar{display:flex;justify-content:space-between;align-items:center;font:13px system-ui,sans-serif;padding:6px 10px;color:var(--mute)}
#pl button{border:0;background:none;color:var(--mute);font-size:18px;cursor:pointer}
#pl .vid{position:relative;padding-top:56.25%}#pl iframe,#yt{position:absolute;inset:0;width:100%;height:100%}
</style></head><body><main>
<nav class="top"><a href="index.html">← 返回各集笔记</a></nav>
%%BODY%%
<h2>出处一览</h2><ol class="notes">%%NOTES%%</ol>
</main>
<div id="pl"><div class="bar"><span id="lbl"></span><button id="x" title="关闭">×</button></div><div class="vid"><div id="yt"></div></div></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
let P=null,ready=false,pending=null,cur=null;
function onYouTubeIframeAPIReady(){}
function play(v,t,lbl){document.getElementById('pl').classList.add('on');document.getElementById('lbl').textContent=lbl;
 if(!P){P=new YT.Player('yt',{videoId:v,playerVars:{rel:0,playsinline:1,start:t,autoplay:1},events:{onReady(e){ready=true;e.target.seekTo(t,true);e.target.playVideo()}}});cur=v;return}
 if(!ready)return; if(v!==cur){P.loadVideoById({videoId:v,startSeconds:t});cur=v}else{P.seekTo(t,true);P.playVideo()}}
document.addEventListener('click',e=>{const s=e.target.closest('sup.fn,a.fn2');if(!s)return;e.preventDefault();
 const lbl=s.dataset.tip||s.textContent;play(s.dataset.v,+s.dataset.t,lbl.split(' · ').slice(0,2).join(' · '))});
document.getElementById('x').onclick=()=>{document.getElementById('pl').classList.remove('on');P&&P.pauseVideo&&P.pauseVideo()};
</script></body></html>
